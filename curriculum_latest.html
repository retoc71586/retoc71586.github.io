<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curriculum</title>
    <meta name="robots" content="noindex,nofollow" />

    <!-- Umami Analytics: after deploying at umami.is, replace YOUR_UMAMI_URL and YOUR_WEBSITE_ID -->
    <script
      defer
      src="https://my-umami-analytics-opal.vercel.app/script.js"
      data-website-id="dd7ed32c-5e8b-4223-b422-aab0c9574aff"
    ></script>

    <style>
      :root {
        --ui-gap: 16px;
        --hdr-pad-h: 20px;
        --close-offset: 1cm;
        --text: #111;
        --muted: #666;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: var(--text);
      }

      header {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--ui-gap) var(--hdr-pad-h);
        padding-right: calc(var(--hdr-pad-h) + var(--close-offset));
        border-bottom: 1px solid #eee;
      }

      header p {
        margin: 0;
        font-size: 1em;
        text-align: justify;
        white-space: normal;
      }

      button {
        all: unset;
        position: absolute;
        right: var(--close-offset);
        top: 50%;
        transform: translateY(-50%);
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
        color: var(--muted);
      }

      button:hover {
        color: #000;
      }

      main {
        height: calc(100vh - 64px);
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>

  <body>
    <header id="note">
      <p>
        This document is a compressed representation of my professional career
        to date.<br />
        If you’re interested in higher-frequency information, let’s get in
        touch!
      </p>
      <button
        aria-label="Dismiss"
        onclick="
          note.remove();
          document.querySelector('main').style.height = '100vh';
        "
      >
        ×
      </button>
    </header>

    <main>
      <iframe src="/static/CV.pdf" title="Curriculum PDF"></iframe>
    </main>
  </body>
</html>
